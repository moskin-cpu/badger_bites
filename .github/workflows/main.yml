name: Publish Badger Bites

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ format('github-pages-{0}-{1}', github.run_id, github.run_attempt) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh UW dining menus
        run: python scripts/fetch_menus.py

      - name: Check date selection and menu failure handling
        run: |
          node --test tests/app.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ format('github-pages-{0}-{1}', github.run_id, github.run_attempt) }}
          path: .

  # Start deployment after the upload job finishes so artifact metadata can settle.
  # A deployment-only retry reuses the build output without uploading a duplicate.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

